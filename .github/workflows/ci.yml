name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Lint (correctness rules)
        run: ruff check .
      - name: Byte-compile every module
        run: python -m compileall -q server robot sim research tests
      - name: Tests (CPU only, no Habitat)
        run: pytest -q
